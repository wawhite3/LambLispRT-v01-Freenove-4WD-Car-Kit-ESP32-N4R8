; LambLisp PlatformIO Project Configuration File
; Locked to this package's target.  Edit build_flags below to change the feature set.
; Last generated: 2026-08-30 00:10 UTC
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Freenove-4WD-Car-Kit-ESP32
boards_dir = ll_pio/boards

[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

; ESP32-S3 DevKit-C: 8MB flash, 2MB PSRAM. CHIP-DETECTED 2026-08-22 (esptool flash_id on MAC dc:da:0c:61:9f:0c: 'Detected flash size: 8MB', device c8:4017, 'Embedded PSRAM 2MB'). Previously declared N4R8/flash_mb=4, which selected partitions_4M.csv and capped app0 at 1.47MB -- 99.3% full -- while ~4MB of the chip stayed unpartitioned. nxry and the chip flag were corrected to N8R2 to match (2026-08-22): the old -DLL_ESP32_N4R8 was not even a declared flag -- ll_platform_generic.h declares LL_ESP32_N4R4 and LL_ESP32S3_N8R2, never LL_ESP32_N4R8 -- and neither flag is read anywhere in the tree, so this is metadata only, no behaviour change.
[env:Freenove-4WD-Car-Kit-ESP32]
extends = common
platform = espressif32
framework = arduino
board = ll_board-freenove-4wd-esp32
board_build.partitions = ll_pio/partitions/partitions_4M_ota_trim.csv
board_build.filesystem = littlefs
lib_deps =
    arduino-libraries/ArduinoBLE@^1.3.2
    h2zero/NimBLE-Arduino@^1.4.0
    arduino-libraries/ArduinoHttpClient@^0.4.0
    bblanchon/ArduinoJson@^6.19.4
monitor_filters = esp8266_exception_decoder
monitor_port = /dev/ttyUSB1
upload_port  = /dev/ttyUSB1
build_flags =
    -DLL_BOARD_NAME='"Freenove-4WD-Car-Kit-ESP32"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_ARDUINO=1
    -DLL_COMMONIO=1
    -DLL_I2C=1
    -DLL_LCD1602=1
    -DLL_MODBUS=1
    -DLL_PCA9685=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLL_SONAR=1
    -DLL_LITTLEFS=1
    -DLL_WIFI=1
    -DLL_WIRE=1
    -DLL_WS2812=1
    -DLL_BIGNUM=1
    -DLL_RATIONAL=1
    -DLL_COMPLEX=1
    -DLL_ESP32=1
    -DLL_Freenove_4WD_Car_Kit_ESP32=1
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=300
    -L$PROJECT_DIR
    -llamblisp

; Freenove ESP32-WROVER-CAM standalone (classic ESP32-D0WD, N4R4: 4MB flash / 4MB usable PSRAM), OV2640 camera, on a Freenove GPIO-extension board / breadboard. Own board def (ll_board-freenove-wrover) + own pin map (boards/pins/Freenove-ESP32-WROVER.scm) -- no longer shares the 4WD's. USB: CH340 (same VID:PID as the 4WD -- select by port). NOTE: usable PSRAM assumed 4MB (classic ESP32 maps max 4MB); bump to R8 if the physical module is 8MB.