[platformio]
default_envs = Freenove-4WD-Car-Kit-ESP32
boards_dir = ll_pio/boards
core_dir = ~/.platformio-idf55

; ============================================================================
; PLATFORM PIN -- DO NOT UNPIN, AND DO NOT BUMP WITHOUT RE-MEASURING MEMORY.
;   = Arduino core 3.3.11 = ESP-IDF 5.5.5   (published 2026-07-24)
; A bare `platform = espressif32` FLOATS to whatever happens to be installed, which
; is why this is pinned at all; the pin is a release URL, so it is also the only
; in-tree record of which core this project is built against.
;
; WHY NOT THE OFFICIAL PLATFORM: platform-espressif32 7.0.1 (PlatformIO's current
; official release) still pins framework-arduinoespressif32 ~3.20017.0 = Arduino
; 2.0.17 = ESP-IDF 4.4.7, which went EOL ~mid-2024.  The official platform never
; advanced the core past 2.0.17, so `framework = arduino` there IS a choice to stay
; on an EOL IDF.  pioarduino is the fork that tracks current Arduino/IDF while
; keeping `framework = arduino`.
;
; WHAT THIS MIGRATION IS FOR: IDF 4.4.7 has no esp_mmu_map(), no PSRAM MMU target,
; and its esp_ptr_executable() excludes the whole 0x3D000000 PSRAM window -- so NCG
; code could only ever live in the 32 KB D/IRAM pool.  IDF 5.x has esp_mmu_map() +
; MMU_MEM_CAP_EXEC + MMU_TARGET_PSRAM0 on the S3.  Whether PSRAM can actually back
; an EXECUTABLE mapping is STILL UNVERIFIED: the primitives exist, the capability
; has not been demonstrated.  Do NOT record it as working until a stub has been
; written into PSRAM and successfully called.
;
; RE-MEASURE BEFORE TRUSTING ANY MEMORY CONSTANT.  These were measured against the
; ESP-IDF 4.4.7 layout and are NOT valid here until re-taken:
;   - LL_NCG_EXEC_POOL_BYTES = 32 KB (ll_platform_generic.h), measured twice over
;     on the S3 and the LX6, not guessed;
;   - the B95 internal-DRAM cliff: at a 128 KB pool the N8R2 had 500 bytes of
;     INTERNAL DRAM free after setup, so every 512-byte LittleFS read returned
;     ESP_ERR_NO_MEM (err 257).
; THE SYMPTOM TO RECOGNISE: a layout change does NOT present as an allocation error
; -- it presents as MISSING TEST FILES, because the reads fail, not the allocations.
; ============================================================================
[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

[env:Freenove-4WD-Car-Kit-ESP32]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = ll_board-freenove-4wd-esp32
board_build.partitions = ll_pio/partitions/partitions_4M_ota.csv
board_build.filesystem = littlefs
board_build.app_partition_name = ota_0
board_upload.offset_address = 0x130000
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    arduino-libraries/ArduinoHttpClient@^0.4.0
    bblanchon/ArduinoJson@^6.19.4
monitor_filters = esp8266_exception_decoder
monitor_port = /dev/ttyUSB1
upload_port  = /dev/ttyUSB1
build_flags =
    -DLL_BOARD_NAME='"Freenove-4WD-Car-Kit-ESP32"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_ESP_ARDUINO=1
    -DLL_COMMONIO=1
    -DLL_I2C=1
    -DLL_LCD1602=1
    -DLL_PCA9685=1
    -DBOARD_HAS_PSRAM
    -DLL_PROFIBUS=1
    -DLL_MODBUS=1
    -DLL_CAMERA=1
    -DLL_SONAR=1
    -DLL_LITTLEFS=1
    -DLL_WIFI=1
    -DLL_WIRE=1
    -DLL_WS2812=1
    -DLL_BIGNUM=1
    -DLL_RATIONAL=1
    -DLL_COMPLEX=1
    -DLL_ESP32=1
    -DLL_XTENSA=1
    -DLL_Freenove_4WD_Car_Kit_ESP32=1
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=300
    -mfix-esp32-psram-cache-issue
    ${sysenv.W3_EXTRA_FLAGS}
    -L$PROJECT_DIR
    -llamblisp

; Freenove ESP32-WROVER-CAM standalone (classic ESP32-D0WD-V3 on a WROVER-E module), OV2640 camera, on a Freenove GPIO-extension board / breadboard.  Own board def (ll_board-freenove-wrover) + own pin map (boards/pins/Freenove-ESP32-WROVER.scm) -- no longer shares the 4WD's.  USB: CH340 (same VID:PID as the 4WD -- select by port).  || N4R8 IS THE PART, 4 MB IS WHAT IT CAN REACH, AND THOSE ARE DIFFERENT FACTS.  This entry read N4R4 until 2026-09-13 because the usable figure had been folded into the part number -- which also made it disagree with Freenove-4WD-Car-Kit-ESP32, the SAME module family, recorded N4R8.  The WROVER-E module carries 8 MB of PSRAM; the classic ESP32 can only MAP 4 MB of it at a time, so the heap limit is 4 MB and that now lives in psram_usable_mb, which _w3_ll_maxblk_fit prefers over the nxry digits.  Encoding it in nxry instead made the record wrong about the hardware in order to be right about a limit.  || THE 8 MB IS FROM THE MODULE SPEC, NOT MEASURED HERE: esptool reports flash, never PSRAM.  To settle it, flash an env with BOARD_HAS_PSRAM and read the boot banner's PSRAM line -- that is how both C5 units were settled (PSRAM free: 7917236 / 8388608).  || PSRAM IS QUAD, and on this part that is not a configuration choice: the classic ESP32 supports 4-line PSRAM only, so no octal reading of this board is possible.