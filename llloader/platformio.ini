; OTA Ph2 -- pure-ESP-IDF llloader (the `factory` app).  Standalone sub-project:
; framework=espidf keeps the trusted recovery root Arduino-core-free and tiny.
; Shares the SAME partition table as the VM build (partitions_4M_ota.csv) so both
; agree byte-for-byte on where factory / ota_0 / storage live.
;
; Target: plain ESP32 (WROVER is ESP32-D0WD).  The loader deliberately avoids PSRAM
; (trusted root must not depend on PSRAM init), so the generic esp32dev board is right.
;
; Build / flash via the w3 verbs (never raw pio):
;   ./w3 make loader                 -- build + echo the "Flash: NN%" fit line
;   ./w3 make flash_loader <port>    -- upload to the factory slot (offset 0x10000)
; Size check (fit 1152 KB factory, grown 704->1152 for WiFi/BLE): the "Flash: NN% of 0x120000" line.

; ESP-IDF 5.5.5 as of 2026-09-04.  PINNED to the same pioarduino release master uses
; (55.03.311); `platform = espressif32` previously meant "whatever PlatformIO's default
; espressif32 is", which was the EOL Arduino-2.0.17 / IDF-4.4.7 line -- so the trusted
; recovery root was building on an older IDF than the VM it recovers.
;
; core_dir IS LOAD-BEARING AND MUST NOT BE DROPPED.  This is a STANDALONE sub-project, so it
; does not inherit the root platformio.ini's `core_dir = ~/.platformio-idf55`.  Without it the
; loader installs pioarduino into the SHARED ~/.platformio, whose framework-arduinoespressif32
; path is the same one the official platform uses -- the two overwrite each other and whichever
; built last wins.  That is not hypothetical: it happened twice on 2026-09-03 (see the
; _core_dir_note in w3_pio/boards.json) and it broke other sessions' builds both times.  It also
; keeps ~/.platformio holding the untouched 4.4.7 toolchain, which is the rollback path.
[platformio]
core_dir = ~/.platformio-idf55
; [B531] The C5 loader needs the repo's own board definitions.  Every other loader env uses a STOCK
; board (esp32dev, esp32-s3-devkitc-1), so this project never needed a boards_dir; the C5-WROOM-1
; N8R8 has no stock definition at all -- the pinned platform ships -n4/-n8r4/-n16r4 and no N8R8 --
; so w3_pio/boards is where it lives.
;
; THIS MAKES w3_pio/boards A SHARED ASSET WITH A NEW CONSUMER.  CLAUDE.md's rule applies: a path
; that resolves from the repo root resolves from NONE of the consuming projects, and [B416] is the
; case where a board JSON's default partition table was changed to a root-relative path, leaving
; LambLisp fine and every comparator flashing `Source w3_pio/partitions/... not found` -- 60 FAIL
; cells that read as three runtimes failing on one board.  `../w3_pio/boards` is relative to THIS
; project root, and every env below names its partition table explicitly, so nothing here depends
; on the JSON's own arduino-framework `partitions` key (which IS root-relative).
boards_dir = ../w3_pio/boards

; ═══════════════════════════════════════════════════════════════════════════════════════════════
; VARIANT MATRIX.  Four recovery contracts x two chips.  WIRE IS ALWAYS PRESENT -- the UART console
; (rung 3) and aux-storage (rung 1) are in every variant, so every loader can be updated over a
; cable no matter what else is compiled out.  The radios are the variables:
;
;   variant   rungs                              buys you
;   wire      aux-storage, UART                  nothing wireless; smallest image
;   wifi      aux-storage, network, UART         UNATTENDED recovery (the only self-healing rung)
;   ble       aux-storage, UART, BLE console     recovery with no cable and no infrastructure
;   wifible   all four                           both; largest image
;
; WHY THIS IS A MATRIX AND NOT A FLAG: the rungs are not interchangeable.  Rung 2 (network) is the
; only one that recovers a board with NO HUMAN PRESENT.  Rung 3b (BLE) is the only one that reaches
; a deployed board an operator cannot physically touch.  Dropping either narrows the RECOVERY
; CONTRACT, which is a product decision per product -- not a size knob.  The sizes are the price of
; each contract, not the reason to pick one.
;
; MEASURED 2026-09-13, classic ESP32, all four built the same day on the pinned 5.5.5 toolchain:
;
;   variant    firmware.bin    of the 1152 KB factory slot   marginal
;   wire          266,843 B          22.6%                   --
;   ble           518,087 B          43.9%                   +251,244 over wire
;   wifi          878,111 B          74.4%                   +611,268 over wire
;   wifible     1,066,571 B          90.4%                   +188,460 over wifi
;
; TWO THINGS THE NUMBERS SAY THAT THE LINK MAP DID NOT.
; (1) THE RADIO COSTS ARE NOT ADDITIVE.  BLE costs 251 KB alone but only 188 KB on top of WiFi, so
;     ~63 KB is infrastructure both stacks need and neither owns (PHY/RF calibration, coex, the NVS
;     that holds calibration data).  Whoever arrives first pays for it -- which makes wifible a
;     better deal than `ble` looks in isolation.
; (2) REMOVING A FEATURE BEATS OPTIMISING THE BINARY, BY 7x.  The older link-map figures (WiFi
;     322,779 B, BT 161,164 B) counted LIBRARIES; the real cost of HAVING a radio includes its
;     dependency tree -- lwIP, esp_netif, esp_event, mbedTLS.  WiFi's true marginal cost is nearly
;     double what the map suggested.  For comparison, LTO was tried the same day and promised ~10%:
;     it did not link at all (see P202), while `wire` is 74% smaller than `wifible`.
;
; DO NOT COMPARE THESE TO THE OLDER 1,036,080 B FIGURE.  That was built from a CACHED sdkconfig
; carrying CONFIG_IDF_INIT_VERSION="6.0.1" while the platform is pinned to 5.5.5 -- 38 settings
; differ, including added protocomm security versions.  Renaming the envs forced a fresh generation
; against the pin, which is why the full build "grew" 30 KB; it did not.  A loader size is only
; comparable to another built from a config generated by the same IDF.
;
; Build:  ./w3 make loader llloader-<chip>-<variant>
; Flash:  ./w3 make flash_loader <port> llloader-<chip>-<variant>
; ═══════════════════════════════════════════════════════════════════════════════════════════════

; wire only -- UART console + aux-storage.  The floor: no radios at all.
[env:llloader-esp32-wire]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.partitions = partitions/partitions_4M_ota.csv
board_upload.offset_address = 0x10000
board_build.app_partition_name = factory
custom_sdkconfig = CONFIG_BT_ENABLED=n
monitor_speed = 115200
build_flags =
    -Os
    -DLOADER_NO_WIFI=1
    -DLOADER_NO_BLE=1
    -DLOADER_NO_TLS=1

; wifi + wire -- adds the only UNATTENDED rung (network fetch).
[env:llloader-esp32-wifi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.partitions = partitions/partitions_4M_ota.csv
board_upload.offset_address = 0x10000
board_build.app_partition_name = factory
