; wire only -- UART console + aux-storage.  The floor: no radios at all.
; ESP32-S3 with 8 MB flash -- the S3-EYE (WROOM-1 N8R8) and any other 8 MB S3.
; WHY THIS EXISTS [B384 recovery, 2026-09-19].  Every other S3 loader env declares 32 MB and
; partitions_32M_ota.csv.  The factory OFFSET is 0x10000 in both tables, so a flash_loader write
; lands correctly either way -- but the 32M table declares ota_0 as 0x400000 long, which from
; 0x130000 runs to 0x530000 and so OVERLAPS the 8 MB table's storage partition at 0x4B0000.  A
; loader built with that view would be wrong about where the filesystem begins, which is the kind
; of error that shows up as corruption much later rather than as a failed flash.
; The board is the stock devkitc-1: a loader needs no camera or PSRAM specifics, only the right
; flash size and partition map.
[env:llloader-esp32s3-8m]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/partitions_8M_ota.csv
board_upload.offset_address = 0x10000
board_build.app_partition_name = factory
custom_sdkconfig = CONFIG_BT_ENABLED=n
monitor_speed = 115200
build_flags =
    -Os
    -DLOADER_NO_WIFI=1
    -DLOADER_NO_BLE=1
    -DLOADER_NO_TLS=1

[env:llloader-esp32c5-8m]
; [B531] The RECOVERY ROOT FOR THE C5.  Three C5 envs use partitions_8M_ota.csv, which reserves
; 1,179,648 bytes for a `factory` llloader, and no loader env targeted a RISC-V chip -- every one of
; them is Xtensa, which cannot execute there.  The reservation existed with nothing that could fill
; it, on the part this project most expects to crash: the NCG, the PMP/W^X work and executable-PSRAM
; are all developed on the C5.
;
; MODELLED ON llloader-esp32s3-8m, same table and same offsets, because the FLASH LAYOUT is the same
; 8 MB OTA layout -- only the core differs.  `wire` variant (no radios): the smallest image and the
; one contract every loader has, and the C5's radio rungs are a separate decision that should be
; made on their merits rather than inherited from this file.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = w3_board-esp32c5-n8r8
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/partitions_8M_ota.csv
board_upload.offset_address = 0x10000
board_build.app_partition_name = factory
custom_sdkconfig = CONFIG_BT_ENABLED=n
monitor_speed = 115200
build_flags =
    -Os
    -DLOADER_NO_WIFI=1
    -DLOADER_NO_BLE=1
    -DLOADER_NO_TLS=1

