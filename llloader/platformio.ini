; OTA Ph2 -- pure-ESP-IDF llloader (the `factory` app).  Standalone sub-project:
; framework=espidf keeps the trusted recovery root Arduino-core-free and tiny.
; Shares the SAME partition table as the VM build (partitions_4M_ota.csv) so both
; agree byte-for-byte on where factory / ota_0 / storage live.
;
; Target: plain ESP32 (WROVER is ESP32-D0WD).  The loader deliberately avoids PSRAM
; (trusted root must not depend on PSRAM init), so the generic esp32dev board is right.
;
; Build / flash via the w3 verbs (never raw pio):
;   ./w3 make loader                 -- build + echo the "Flash: NN%" fit line
;   ./w3 make flash_loader <port>    -- upload to the factory slot (offset 0x10000)
; Size check (fit 1152 KB factory, grown 704->1152 for WiFi/BLE): the "Flash: NN% of 0x120000" line.

[env:llloader-esp32]
platform = espressif32
framework = espidf
board = esp32dev
board_build.partitions = partitions/partitions_4M_ota.csv
board_upload.offset_address = 0x10000
monitor_speed = 115200
build_flags =
    -Os
    -DLOADER_NO_TLS=1
